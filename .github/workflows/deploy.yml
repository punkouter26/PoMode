name: CI/CD — Build, Test & Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      deploy_infra:
        description: 'Apply infra/main.bicep (az deployment sub create) during deploy'
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # OIDC federated credential — exchanges GitHub OIDC token for Azure access token via azure/login@v2
  id-token: write

env:
  DOTNET_VERSION: '10.0.x'
  AZURE_WEBAPP_NAME: app-pomode
  AZURE_WEBAPP_URL: https://app-pomode.azurewebsites.net
  API_PROJECT_PATH: src/PoMode.API/PoMode.API.csproj

jobs:
  lint-infra:
    name: Lint Infra (Bicep)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Cache Bicep CLI
        uses: actions/cache@v4
        with:
          path: ~/.azure/bin
          key: bicep-${{ runner.os }}
      - name: Install Bicep CLI
        run: az bicep install
      - name: Compile Bicep → ARM (catches template errors)
        run: |
          set -euo pipefail
          find infra -name '*.bicep' -print0 | while IFS= read -r -d '' f; do
            echo "→ $f"
            az bicep build --file "$f" --stdout > /dev/null
          done

  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      # NuGet cache keyed on project files and Directory.Packages.props
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Restore
        run: dotnet restore
      - name: Build (Release, no-restore)
        run: dotnet build --no-restore -c Release
      - name: Test (Unit tests)
        run: dotnet test tests/PoMode.Unit --no-build -c Release --verbosity minimal
      - name: Publish API & WASM Host
        run: dotnet publish ${{ env.API_PROJECT_PATH }} -c Release --no-build -o publish
      - name: Upload webapp artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: publish
          retention-days: 14

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: [lint-infra, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ env.AZURE_WEBAPP_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: webapp
          path: publish
      # OIDC federated identity login — no client secrets stored in GitHub
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Did infra change?
        id: infra
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.deploy_infra }}" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] && git diff --quiet ${{ github.event.before }} ${{ github.sha }} -- infra/ 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Provision infra (Bicep)
        if: steps.infra.outputs.changed == 'true'
        run: |
          az deployment sub create \
            --location eastus2 \
            --template-file infra/main.bicep \
            --name pomode-${{ github.run_id }} \
            -o none

      - name: Package and zip deploy
        run: |
          cd publish
          zip -r ../webapp.zip . -q
          cd ..

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: webapp.zip

      - name: Smoke test the deployed site
        run: |
          set -euo pipefail
          echo "Waiting for ${{ env.AZURE_WEBAPP_URL }}/health …"
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${{ env.AZURE_WEBAPP_URL }}/health" || echo 000)
            if [ "$code" = "200" ]; then
              echo "health OK after ${attempt} attempt(s)"
              break
            fi
            if [ "$attempt" = "30" ]; then
              echo "::error::Site did not become healthy after the deploy (last status: $code)"
              exit 1
            fi
            sleep 10
          done

          # Diagnostics summary endpoint check
          diag=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${{ env.AZURE_WEBAPP_URL }}/api/diagnostics/summary")
          [ "$diag" = "200" ] || { echo "::error::/api/diagnostics/summary returned $diag, expected 200"; exit 1; }

          # Pipeline executors endpoint check
          executors=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${{ env.AZURE_WEBAPP_URL }}/api/analysis/executors")
          [ "$executors" = "200" ] || { echo "::error::/api/analysis/executors returned $executors, expected 200"; exit 1; }

          # Mode Lab / SPA shell route check
          modes=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${{ env.AZURE_WEBAPP_URL }}/modes")
          [ "$modes" = "200" ] || { echo "::error::/modes returned $modes, expected 200"; exit 1; }

          echo "Smoke tests passed successfully."
