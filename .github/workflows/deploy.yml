name: CI/CD — Build, Test & Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Bicep runs on every deploy now, so there is no longer an input to opt into it.
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # OIDC federated credential — exchanges GitHub OIDC token for Azure access token via azure/login@v2
  id-token: write

env:
  DOTNET_VERSION: '10.0.x'
  AZURE_WEBAPP_NAME: app-pomode
  AZURE_WEBAPP_URL: https://app-pomode.azurewebsites.net
  API_PROJECT_PATH: src/PoMode.API/PoMode.API.csproj
  BICEP_VERSION: v0.30.23

jobs:
  lint-infra:
    name: Lint Infra (Bicep)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Cache Bicep CLI
        uses: actions/cache@v4
        with:
          path: ~/.azure/bin
          # Version in the key: without it the cache is restored forever and az bicep install
          # becomes a no-op against an increasingly stale copy.
          key: bicep-${{ runner.os }}-${{ env.BICEP_VERSION }}
      - name: Install Bicep CLI
        run: az bicep install --version ${{ env.BICEP_VERSION }}
      - name: Compile Bicep → ARM (catches template errors)
        run: |
          set -euo pipefail
          find infra -name '*.bicep' -print0 | while IFS= read -r -d '' f; do
            echo "→ $f"
            az bicep build --file "$f" --stdout > /dev/null
          done

  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      # NuGet cache keyed on project files and Directory.Packages.props
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Restore
        run: dotnet restore
      - name: Build (Release, no-restore)
        run: dotnet build --no-restore -c Release
      # Unit only, by choice: this pipeline is a deploy gate, not the full test estate. The other
      # three suites run locally — E2EAPI in-process, Integration against Azurite, E2EUI against a
      # Playwright browser. The deploy smoke step below is what guards the routes in CI.
      - name: Test (Unit)
        run: dotnet test tests/PoMode.Unit --no-build -c Release --verbosity minimal
      - name: Publish API & WASM Host
        run: dotnet publish ${{ env.API_PROJECT_PATH }} -c Release --no-build -o publish
      - name: Upload webapp artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: publish
          retention-days: 14

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: [lint-infra, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ env.AZURE_WEBAPP_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: webapp
          path: publish
      # OIDC federated identity login — no client secrets stored in GitHub
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Always, not only when infra/ changed. Bicep is the source of truth for the app settings the
      # code depends on, and it is idempotent, so running it costs a minute and removes an outage
      # path: a push that did not touch infra/ used to skip this and leave whatever settings the App
      # Service happened to carry. That matters because Program.cs throws on startup in Production by
      # design, so a stale ASPNETCORE_ENVIRONMENT takes the site down instead of failing the build.
      - name: Provision infra (Bicep)
        run: |
          az deployment sub create \
            --location eastus2 \
            --template-file infra/main.bicep \
            --name pomode-${{ github.run_id }} \
            -o none

      - name: Verify the settings the app refuses to start without
        run: |
          set -euo pipefail
          env_name=$(az webapp config appsettings list -n ${{ env.AZURE_WEBAPP_NAME }} -g PoMode \
            --query "[?name=='ASPNETCORE_ENVIRONMENT'].value | [0]" -o tsv)
          echo "ASPNETCORE_ENVIRONMENT=$env_name"
          if [ "$env_name" = "Production" ]; then
            echo "::error::Production is the one value Program.cs throws on. Refusing to deploy over a working site."
            exit 1
          fi

      - name: Package and zip deploy
        run: |
          cd publish
          zip -r ../webapp.zip . -q
          cd ..

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: webapp.zip

      - name: Smoke test the deployed site
        run: |
          set -euo pipefail
          echo "Waiting for ${{ env.AZURE_WEBAPP_URL }}/health …"
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${{ env.AZURE_WEBAPP_URL }}/health" || echo 000)
            if [ "$code" = "200" ]; then
              echo "health OK after ${attempt} attempt(s)"
              break
            fi
            if [ "$attempt" = "30" ]; then
              echo "::error::Site did not become healthy after the deploy (last status: $code)"
              exit 1
            fi
            sleep 10
          done

          # Every API check below asserts JSON, not just a 200. MapFallbackToFile serves the SPA shell
          # for anything unmatched, so a status-only check passes against a route that does not exist
          # and against any typo. The previous /api/diagnostics/summary check did exactly that.
          check_json() {
            body=$(curl -s --max-time 20 -H 'Accept: application/json' "${{ env.AZURE_WEBAPP_URL }}$1")
            case "$body" in
              '{'*|'['*) ;;
              *) echo "::error::$1 did not return JSON. First bytes: $(printf '%.80s' "$body")"; exit 1 ;;
            esac
          }

          # Diagnostics report
          check_json /diag

          # Pipeline executors
          check_json /api/analysis/executors

          # Mode Lab data the page cannot render without
          check_json /api/modal-melodies/progressions

          # SPA shell still serves its routes
          modes=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${{ env.AZURE_WEBAPP_URL }}/modes")
          [ "$modes" = "200" ] || { echo "::error::/modes returned $modes, expected 200"; exit 1; }

          echo "Smoke tests passed successfully."
