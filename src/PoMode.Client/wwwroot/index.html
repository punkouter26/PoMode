<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover lets the page paint under a notch and a home indicator; the header and
         the page gutters buy their margin back with env(safe-area-inset-*), so the only thing that
         reaches the rounded corners is background. Without it the browser letterboxes the page and
         a phone loses vertical budget this app is trying to fit content into. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PoMode</title>
    <base href="/" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%8E%B5%3C/text%3E%3C/svg%3E" />
    <!-- Radzen ships separate light and dark bases. Loading both under prefers-color-scheme media
         queries makes the component library follow the OS theme with no JS by default. The header's
         theme toggle (js/theme.js) overrides by rewriting these links' media attributes, which is
         why they carry ids. Without the dark base, Radzen cards stay white while app.css flips to
         light text — unreadable. -->
    <link id="radzen-light" rel="stylesheet" href="_content/Radzen.Blazor/css/material-base.css"
          media="(prefers-color-scheme: light)" />
    <link id="radzen-dark" rel="stylesheet" href="_content/Radzen.Blazor/css/material-dark-base.css"
          media="(prefers-color-scheme: dark)" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="PoMode.Client.styles.css" />
    <!-- Installable, and a share target for audio on Android: a voice memo can be shared straight
         into PoMode instead of being saved and then found again. theme-color is the accent, so the
         installed app's title bar matches the header rather than defaulting to white. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- One theme-color per scheme, so the installed app's title bar matches the page it is framing
         rather than showing a light accent above a dark UI. -->
    <meta name="theme-color" content="#6750a4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PoMode" />
    <script>
        // Pre-paint theme: apply any persisted override before the first frame so a user who chose
        // Dark on a light-OS machine never sees a light flash. Mirrors js/theme.js's apply().
        (function () {
            var mode = null;
            try { mode = localStorage.getItem('pm-theme'); } catch (e) { }
            if (mode === 'light' || mode === 'dark') {
                document.documentElement.dataset.theme = mode;
                document.getElementById('radzen-light').media = mode === 'light' ? 'all' : 'not all';
                document.getElementById('radzen-dark').media = mode === 'dark' ? 'all' : 'not all';
            }
        })();
    </script>
</head>
<body>
    <div id="app">Loading…</div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/Radzen.Blazor/Radzen.Blazor.js"></script>
    <script type="module">
        // Registered from a module so a browser without service workers simply skips it, and after
        // load so registration never competes with the WASM runtime the user is waiting on.
        import('./js/shell/pwa.js').then(pwa => pwa.register()).catch(() => { });
    </script>
</body>
</html>
