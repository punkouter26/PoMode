<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PoMode</title>
    <base href="/" />
    <!-- Radzen ships separate light and dark bases. Loading both under prefers-color-scheme media
         queries makes the component library follow the OS theme with no JS and no theme switcher,
         which is what NET_RULES ("auto-detect system Light/Dark themes") asks for. Without the dark
         base, Radzen cards stay white while app.css flips to light text — unreadable. -->
    <link rel="stylesheet" href="_content/Radzen.Blazor/css/material-base.css"
          media="(prefers-color-scheme: light)" />
    <link rel="stylesheet" href="_content/Radzen.Blazor/css/material-dark-base.css"
          media="(prefers-color-scheme: dark)" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="PoMode.Client.styles.css" />
</head>
<body>
    <div id="app">Loading…</div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/Radzen.Blazor/Radzen.Blazor.js"></script>
</body>
</html>
