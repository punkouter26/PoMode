# One shared Azurite serves every PoMode variant (PoMode, PoModeAg, PoModeMm) on the
# well-known ports. Start it from any ONE of the three repos: docker compose up -d
# If the name "pomode-azurite" is already in use, it is already running from a sibling repo.
services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: pomode-azurite
    restart: unless-stopped
    ports:
      - "10000:10000" # Blob Service
      - "10001:10001" # Queue Service
      - "10002:10002" # Table Service
    volumes:
      - ./.azurite_data:/data
    command: "azurite --blobHost 0.0.0.0 --blobPort 10000 --queueHost 0.0.0.0 --queuePort 10001 --tableHost 0.0.0.0 --tablePort 10002 --location /data --loose"
